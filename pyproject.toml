[project]
name = "passphoto-validation"
version = "0.1.0"
description = "Checks a photo against the German ID photo rules (the Fotomustertafel): 39 checks feeding 36 rules, as a CLI, an API and an HTML report."
keywords = ["passport photo", "ID photo", "Fotomustertafel", "ISO/IEC 29794-5", "OFIQ"]
readme = "README.md"
authors = [
    {name = "Simon Lund", email = "41208671+simon-lund@users.noreply.github.com"},
]
# MediaPipe has no wheels for newer Pythons yet (.python-version pins 3.12)
requires-python = ">=3.12"
license = { text = "EUPL 1.2" }
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "pydantic>=2.0",
    "python-dotenv",
    "fastapi",
    "python-multipart",
    "uvicorn",
    "pillow",
    "opencv-python",
    "mediapipe>=0.10.21",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic-settings>=2.15.0",
    # The HTML report of /v1/check (report_html.py)
    "jinja2>=3.1",
]

[project.urls]
Source = "https://github.com/simon-lund/passphoto-validation"
Issues = "https://github.com/simon-lund/passphoto-validation/issues"

[project.optional-dependencies]
test = [
    "pytest",
    "httpx",
    "jupyter",
    "matplotlib",
    "pandas>=2.3.3",
]
# SigLIP second opinions on the eyes (core/siglip.py); the tokenizer needs transformers and sentencepiece
siglip = [
    "torch>=2.4",
    "torchvision",  # listed so it comes from the same CPU index as torch
    "open_clip_torch>=3.3,<4",  # the thresholds were calibrated with 3.3
    "transformers",
    "sentencepiece",
    "protobuf",
]

[project.scripts]
passport-validator = "passphoto_validation.cli:app"
passport-validator-api = "passphoto_validation.check_api:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# CPU-only PyTorch: the default Linux wheels pull in several GB of CUDA libraries
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"passphoto_validation" = ["templates/*.html"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
