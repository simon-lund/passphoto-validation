[project]
name = "edutap.image_api"
version = "1.0.0.dev0"
description = "A eduTAP Image API Service based on FastAPI to to auto crop and transform photos for id cards and passes in smart device wallets."
keywords = ["image", "API"]
readme = "README.md"
authors = [
    {name = "Philipp Auersperg-Castell", email = "phil@bluedynamics.com"},
    {name = "Alexander Loechel", email = "Alexander.Loechel@lmu.de"},
]
requires-python = ">=3.10"
license = { text = "EUPL 1.2" }
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Object Brokering",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic[email,dotenv]>=2.0",
    "python-dotenv",
    "fastapi",
    "fastapi-chameleon",
    "python-multipart",
    "uvicorn",
    "requests",
    "aiokafka",
    "pillow",
    "opencv-python",
    "mediapipe>=0.10.21",
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "brisque>=0.0.17",
    "pydantic-settings>=2.15.0",
    "scikit-image>=0.25.2",
    # The HTML report of /v1/check (report_html.py)
    "jinja2>=3.1",
]

[project.urls]
Source = "https://github.com/edutap-eu/edutap.image_api"
Issues = "https://github.com/edutap-eu/edutap.image_api/issues"
Documentation = "https://docs.edutap.eu/packages/edutap_image_api/index.html"

[project.optional-dependencies]
test = [
    "pytest",
    "httpx",
    "requests-mock",
    "jupyter",
    "matplotlib",
    "mypy",
    "types-requests",
    "pytest-stub",
    "pandas>=2.3.3",
]
develop = [
    "pdbpp",
    "ipython",
]
# SigLIP second opinions on the eyes (core/siglip.py); the tokenizer needs transformers and sentencepiece
siglip = [
    "torch>=2.4",
    "torchvision",  # listed so it comes from the same CPU index as torch
    "open_clip_torch>=3.3,<4",  # the thresholds were calibrated with 3.3
    "transformers",
    "sentencepiece",
    "protobuf",
]

[project.scripts]
image_api = "edutap.image_api.main:main"
passport-validator = "edutap.image_api.cli:app"
passport-validator-api = "edutap.image_api.check_api:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# CPU-only PyTorch: the default Linux wheels pull in several GB of CUDA libraries
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"edutap.image_api" = ["templates/*.html"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]

[tool.isort]
profile = "plone"

[tool.black]
target-version = ["py310"]
include = "src"

[tool.codespell]
ignore-words-list = "discreet,"
skip = "./ansible/*.yml,traefik.yaml,./.vscode/*.json"

[tool.check-manifest]
ignore = [
    ".editorconfig",
    ".pre-commit-config.yaml",
    "tox.ini",
    "mypy.ini",
    ".flake8",
    "mx.ini",
    "ansible/*.yml",
    "Vagrantfile",
]
