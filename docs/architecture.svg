<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b3b3b"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #3b3b3b; stroke-width: 1.4; }
      .group { fill: #f4f4f2; stroke: #9a9a96; stroke-width: 1; stroke-dasharray: 4 3; }
      .accent { fill: #ffffff; stroke: #1a5fb4; stroke-width: 1.8; }
      .title { font-weight: 600; fill: #111; }
      .small { font-size: 11.5px; fill: #333; }
      .muted { font-size: 11px; fill: #666; }
      .flow { fill: none; stroke: #3b3b3b; stroke-width: 1.4; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #1a5fb4; stroke-width: 1.4; stroke-dasharray: 5 3; marker-end: url(#arrow); }
      .feed { fill: none; stroke: #9a9a96; stroke-width: 1.2; stroke-dasharray: 2 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- Row 1: input to gate -->
  <rect class="box" x="20" y="30" width="190" height="78" rx="3"/>
  <text x="32" y="50" class="title">One photo in</text>
  <text x="32" y="68" class="small">CLI  passport-validator validate</text>
  <text x="32" y="84" class="small">API  POST /v1/check</text>
  <text x="32" y="100" class="small">notebooks, scripts</text>

  <path class="flow" d="M 210 69 L 248 69"/>

  <rect class="box" x="250" y="30" width="170" height="78" rx="3"/>
  <text x="262" y="50" class="title">prepare_image</text>
  <text x="262" y="68" class="small">EXIF rotation applied,</text>
  <text x="262" y="84" class="small">any mode to BGR</text>
  <text x="262" y="100" class="muted">core/utils.py</text>

  <path class="flow" d="M 420 69 L 458 69"/>

  <rect class="box" x="460" y="30" width="200" height="78" rx="3"/>
  <text x="472" y="50" class="title">Face gate</text>
  <text x="472" y="68" class="small">MediaPipe face detection:</text>
  <text x="472" y="84" class="small">exactly one face, or the report</text>
  <text x="472" y="100" class="small">stops here (face_detected fails)</text>

  <path class="flow" d="M 660 69 L 698 69"/>

  <rect class="group" x="700" y="18" width="260" height="206" rx="4"/>
  <text x="712" y="36" class="title">Shared measurements, once per photo</text>
  <rect class="box" x="712" y="46" width="236" height="38" rx="3"/>
  <text x="722" y="62" class="small"><tspan class="title">Face mesh</tspan>  MediaPipe, 478 points, irises</text>
  <text x="722" y="77" class="muted">geometry, eyes, retouching, colour cast</text>
  <rect class="box" x="712" y="90" width="236" height="38" rx="3"/>
  <text x="722" y="106" class="small"><tspan class="title">Person mask</tspan>  selfie segmentation</text>
  <text x="722" y="121" class="muted">background checks, crop planning</text>
  <rect class="box" x="712" y="134" width="236" height="38" rx="3"/>
  <text x="722" y="150" class="small"><tspan class="title">OFIQ</tspan>  ISO/IEC 29794-5, optional</text>
  <text x="722" y="165" class="muted">pose, expression, eyes, occlusion, colour</text>
  <rect class="box" x="712" y="178" width="236" height="38" rx="3"/>
  <text x="722" y="194" class="small"><tspan class="title">SigLIP</tspan>  zero-shot, optional, warn only</text>
  <text x="722" y="209" class="muted">glare on glasses, gaze</text>

  <!-- down to checks -->
  <path class="flow" d="M 830 224 L 830 262"/>

  <!-- Row 2: checks -->
  <rect class="box" x="250" y="264" width="710" height="96" rx="3"/>
  <text x="262" y="284" class="title">39 checks</text>
  <text x="340" y="284" class="small">core/checks/: geometry · quality · lighting · background · retouching · features · eyes · ofiq · siglip</text>
  <text x="262" y="304" class="small">Each check reads the ValidationContext (photo + shared measurements), writes its measurements and its</text>
  <text x="262" y="320" class="small">reasons, and ends as  pass · warn · fail · skipped (could not judge) · error (crashed).</text>
  <text x="262" y="340" class="small">Every warn and fail threshold comes from one table, core/thresholds.py, with a note on where the number came from.</text>

  <!-- Row 3: rules and report -->
  <path class="flow" d="M 605 360 L 605 398"/>

  <rect class="box" x="250" y="400" width="350" height="110" rx="3"/>
  <text x="262" y="420" class="title">36 rules of the Fotomustertafel</text>
  <text x="262" y="440" class="small">core/rules.py: each rule names the checks that cover it</text>
  <text x="262" y="456" class="small">(26 fully, 10 partly) and takes the worst status of those that ran.</text>
  <text x="262" y="476" class="small">A rule none of whose checks could run is skipped.</text>
  <text x="262" y="496" class="small">Valid = no rule fails, no check crashed, no rule skipped.</text>

  <path class="flow" d="M 600 455 L 638 455"/>

  <rect class="accent" x="640" y="400" width="320" height="110" rx="3"/>
  <text x="652" y="420" class="title">Report</text>
  <text x="652" y="440" class="small">PassportPhotoReport (core/models.py): verdict, every</text>
  <text x="652" y="456" class="small">rule and check with reasons and measurements, the crop.</text>
  <text x="652" y="476" class="small">JSON, pinned by api_schema.py · HTML page (report_html.py)</text>
  <text x="652" y="492" class="small">· CLI table. Error answers carry a stable code.</text>

  <!-- autocrop loop -->
  <path class="loop" d="M 800 510 L 800 586 L 235 586 L 235 350 L 248 350"/>
  <text x="190" y="552" class="small" fill="#1a5fb4">Autocrop: core/crop.py plans a 35×45 box from mesh and mask when</text>
  <text x="190" y="568" class="small" fill="#1a5fb4">framing warns or fails; the checks run again on the crop. The verdict never depends on it.</text>

  <!-- Left column: thresholds and evaluation -->
  <rect class="box" x="20" y="264" width="200" height="96" rx="3"/>
  <text x="32" y="284" class="title">Settings</text>
  <text x="32" y="302" class="small">core/thresholds.py: the table</text>
  <text x="32" y="318" class="small">ValidatorConfig (.env): OFIQ dir,</text>
  <text x="32" y="334" class="small">SigLIP, resolution, autocrop</text>
  <text x="32" y="352" class="muted">read when the validator starts</text>
  <path class="feed" d="M 220 300 L 248 300"/>

  <rect class="box" x="20" y="400" width="200" height="110" rx="3"/>
  <text x="32" y="420" class="title">Evaluation</text>
  <text x="32" y="438" class="small">London Set, 2,850 labelled photos:</text>
  <text x="32" y="454" class="small">odd ids set the thresholds,</text>
  <text x="32" y="470" class="small">even ids measure them.</text>
  <text x="32" y="486" class="small">Open Images, 240 real photos.</text>
  <text x="32" y="502" class="muted">scripts/, notebooks/evaluation.ipynb</text>
  <path class="feed" d="M 120 400 L 120 362"/>

  <text x="20" y="612" class="muted">Solid arrows: the photo's way through the pipeline. Dotted: what feeds the checks. Dashed blue: the one loop, the crop.</text>
</svg>
